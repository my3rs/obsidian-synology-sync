name: Release Beta Obsidian plugin

on:
    workflow_dispatch:
        inputs:
            tag_name:
                description: 'Beta Tag Name (e.g. 1.0.1-beta.1, leave empty to auto-generate)'
                required: false
                type: string
    push:
        tags:
            - '*-beta*'
            - '*-alpha*'
            - '*-rc*'
            - '*beta*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Create Pre-release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  if [ -n "${{ inputs.tag_name }}" ]; then
                      tag="${{ inputs.tag_name }}"
                  elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
                      tag="${GITHUB_REF#refs/tags/}"
                  else
                      version=$(node -p "require('./manifest.json').version")
                      tag="${version}-beta.${GITHUB_RUN_NUMBER}"
                  fi

                  echo "Creating pre-release for tag: $tag"

                  gh release create "$tag" \
                    --title="$tag" \
                    --prerelease \
                    main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
